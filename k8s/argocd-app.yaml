apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: wms
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/KaveenAlahapperuma/water-management-system-gitops.git
    targetRevision: main
    path: k8s
  destination:
    server: https://kubernetes.default.svc
    namespace: wms
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true