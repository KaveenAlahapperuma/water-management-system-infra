apiVersion: v1
kind: Namespace
metadata:
  name: wms
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: backend-env
  namespace: wms
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: aws-secrets
  target:
    name: backend-env
  dataFrom:
    - extract:
        key: wms/backend
  data:
    - secretKey: DATABASE_USERNAME
      remoteRef:
        key: rds!db-162fee37-3c8f-486f-9920-11a3a8ee8993
        property: username
    - secretKey: DATABASE_PASSWORD
      remoteRef:
        key: rds!db-162fee37-3c8f-486f-9920-11a3a8ee8993
        property: password